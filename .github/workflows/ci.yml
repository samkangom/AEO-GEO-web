name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  e2e:
    name: Database (RLS) + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,realtime,postgres-meta,supavisor

      - name: RLS tests
        run: npm run test:db

      - name: Export Supabase env
        run: |
          set -euo pipefail
          npx supabase status -o json > /tmp/sb.json
          url=$(jq -er '.API_URL' /tmp/sb.json)
          key=$(jq -er '.ANON_KEY' /tmp/sb.json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          E2E_FULL: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
